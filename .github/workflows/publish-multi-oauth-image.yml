name: Publish Multi-OAuth Image

on:
  push:
    tags:
      - "v1.97.0-multi-oauth.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable image version, for example 1.97.0-multi-oauth.2"
        required: true
        default: "1.97.0-multi-oauth.2"
        type: string
      commit_sha:
        description: "Full 40-character commit SHA to build"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-multi-oauth-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/litellm
  UPSTREAM_VERSION: "1.97.0"
  UPSTREAM_SHA: ef84494d52c6708e4e9f4a54ce551a265995ad8f

jobs:
  prepare:
    name: Validate immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      image: ${{ steps.release.outputs.image }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Validate release inputs
        id: release
        env:
          DISPATCH_COMMIT_SHA: ${{ inputs.commit_sha }}
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            commit_sha="${DISPATCH_COMMIT_SHA}"
            version="${DISPATCH_VERSION}"
          else
            commit_sha="$(git rev-parse HEAD)"
            version="${REF_NAME#v}"
          fi

          if [[ ! "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full lowercase 40-character SHA"
            exit 1
          fi
          if [[ ! "${version}" =~ ^1\.97\.0-multi-oauth\.[1-9][0-9]*$ ]]; then
            echo "::error::version must match 1.97.0-multi-oauth.N"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${commit_sha}" ]]; then
            echo "::error::checked-out commit does not match commit_sha"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${UPSTREAM_SHA}" "${commit_sha}"; then
            echo "::error::commit is not based on the pinned LiteLLM upstream SHA"
            exit 1
          fi

          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${project_version}" != "${UPSTREAM_VERSION}" ]]; then
            echo "::error::pyproject.toml version ${project_version} does not match ${UPSTREAM_VERSION}"
            exit 1
          fi

          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${commit_sha:0:12}" >> "${GITHUB_OUTPUT}"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing immutable tags
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in "${VERSION}" "sha-${SHORT_SHA}"; do
            if docker buildx imagetools inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "::error::immutable image tag already exists: ${IMAGE}:${tag}"
              exit 1
            fi
          done

  build:
    name: Build and verify ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}
          labels: |
            org.opencontainers.image.title=LiteLLM Multi-OAuth
            org.opencontainers.image.description=LiteLLM ${{ env.UPSTREAM_VERSION }} with per-model ChatGPT OAuth profiles
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build smoke-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: litellm-multi-oauth-smoke:${{ needs.prepare.outputs.short_sha }}-${{ matrix.artifact }}
          cache-from: type=gha,scope=multi-oauth-${{ env.UPSTREAM_VERSION }}-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=multi-oauth-${{ env.UPSTREAM_VERSION }}-${{ matrix.artifact }}

      - name: Verify the built image
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            "litellm-multi-oauth-smoke:${SHORT_SHA}-${ARTIFACT}" \
            -c "from litellm.llms.chatgpt.authenticator import get_cached_authenticator; from litellm.types.router import GenericLiteLLMParams; p = GenericLiteLLMParams(chatgpt_auth_file='/tmp/account/auth.json'); assert p.chatgpt_auth_file == '/tmp/account/auth.json'; assert get_cached_authenticator('/tmp/account/auth.json') is get_cached_authenticator('/tmp/account/./auth.json')"

      - name: Build and publish image by digest
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=multi-oauth-${{ env.UPSTREAM_VERSION }}-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=multi-oauth-${{ env.UPSTREAM_VERSION }}-${{ matrix.artifact }}

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish immutable multi-platform manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable manifest
        id: manifest
        env:
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail

          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "::error::expected exactly two platform digests"
            exit 1
          fi

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=LiteLLM Multi-OAuth" \
            --annotation "index:org.opencontainers.image.description=LiteLLM ${UPSTREAM_VERSION} with per-model ChatGPT OAuth profiles" \
            --annotation "index:org.opencontainers.image.revision=${COMMIT_SHA}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --metadata-file "${RUNNER_TEMP}/manifest-metadata.json" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            "${sources[@]}"

          digest="$(jq -er '."containerimage.descriptor".digest' "${RUNNER_TEMP}/manifest-metadata.json")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify published tags and platforms
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          manifest="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Manifest}}')"
          version_digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -er '.digest')"
          sha_digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}" --format '{{json .Manifest}}' | jq -er '.digest')"

          [[ "${version_digest}" == "${DIGEST}" ]]
          [[ "${sha_digest}" == "${DIGEST}" ]]
          jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1' <<< "${manifest}"
          jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1' <<< "${manifest}"

      - name: Attest the published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Write release summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          {
            echo "## Published LiteLLM Multi-OAuth image"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${{ needs.prepare.outputs.commit_sha }}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Deployment reference: \`${IMAGE}@${DIGEST}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "${GITHUB_STEP_SUMMARY}"
